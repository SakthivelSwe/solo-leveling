<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#6c63ff" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#534ab7" />
      <stop offset="100%" stop-color="#4fc3f7" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing hexagon -->
  <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#neon)" opacity="0.8"/>
  <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Diamond -->
  <polygon points="50,15 80,50 50,85 20,50" fill="none" stroke="url(#secondaryGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- The "S" Shape -->
  <path d="M 62 35 C 62 20, 38 20, 38 35 C 38 50, 62 50, 62 65 C 62 80, 38 80, 38 65" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M 62 35 C 62 20, 38 20, 38 35 C 38 50, 62 50, 62 65 C 62 80, 38 80, 38 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
